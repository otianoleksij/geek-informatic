  <section class="intro">
    <p class="notebook-head">{{sirnyky.eyebrow}}</p>
    <h1><span class="hl">{{sirnyky.title}}</span></h1>
    <p class="lead">{{sirnyky.lead}}</p>
  </section>

  <div class="filters" id="filters" role="group" aria-label="{{sirnyky.goalGroup}}"></div>

  <section class="stage" aria-label="{{sirnyky.stageAria}}">
    <article class="card" id="card">
      <div class="confetti" id="confetti" aria-hidden="true"></div>
      <div class="card-head">
        <span class="counter" id="counter"></span>
        <span class="badges">
          <span class="badge done" id="seen" hidden>{{sirnyky.seen}}</span>
          <span class="badge" id="level"></span>
        </span>
      </div>
      <p class="task" id="task"></p>
      <p class="answers-count" id="answersCount"></p>
      <div class="board-wrap" id="boardWrap">
        <div class="board" id="board" role="group"></div>
      </div>
      <div class="found" id="found" hidden>
        <span class="found-title">{{sirnyky.foundTitle}}</span>
        <span class="found-list" id="foundList"></span>
      </div>
      <div class="tools">
        <button class="btn ghost" id="undo" type="button">{{sirnyky.undo}}</button>
        <button class="btn" id="retry" type="button" hidden></button>
        <button class="btn ghost" id="hint" type="button">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18h6M10 21h4"/><path d="M12 3a6 6 0 0 0-3.6 10.8c.7.6 1.1 1.3 1.1 2.2h5c0-.9.4-1.6 1.1-2.2A6 6 0 0 0 12 3z" fill="#FFE45C"/></svg>
          <span id="hintTxt">{{sirnyky.hint}}</span>
        </button>
        <button class="btn ghost" id="next" type="button">{{sirnyky.next}}
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
        </button>
      </div>
      <div class="feedback" id="feedback" role="status" aria-live="polite"></div>
      <p class="keys">{{sirnyky.keys}}</p>
    </article>
    <p class="counter" id="solved" style="margin-top:14px"></p>
  </section>
