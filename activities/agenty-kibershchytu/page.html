<header class="bar">
  <div class="wrap">
    <a class="home" href="{{homeHref}}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5"/><path d="M11 6l-6 6 6 6"/></svg>{{agenty-kibershchytu.barHome}}</a>
    <div class="brand">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round" aria-hidden="true"><path d="M12 2.5l8 3v6.2c0 4.9-3.4 8.3-8 9.8-4.6-1.5-8-4.9-8-9.8V5.5z"/><path d="M8.5 12l2.5 2.5 4.5-5"/></svg>
      {{agenty-kibershchytu.brand}}
    </div>
    <div class="keys" id="keys" role="group" aria-label="{{agenty-kibershchytu.keysAria}}"></div>
    <div class="meta"><span>{{agenty-kibershchytu.time}} <b id="timer">00:00</b></span><span>{{agenty-kibershchytu.points}} <b id="pts">0</b></span></div>
    <button type="button" class="restart" id="restart" hidden title="{{agenty-kibershchytu.restartTitle}}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12a8 8 0 1 0 2.4-5.7"/><path d="M4 4v4.5h4.5"/></svg><span>{{agenty-kibershchytu.restart}}</span></button>
  </div>
</header>

<main class="wrap">
  <div id="loadError" class="noscript load-error" role="alert" hidden>{{common.loadError}}</div>
  <noscript><p class="noscript">{{common.noscript}}</p></noscript>
  <!-- Вміст #view замінює app.js, щойно завантажить місії; без JS лишається цей текст -->
  <div id="view" class="stack lg">
    <div class="stack">
      <div class="eyebrow">{{agenty-kibershchytu.eyebrow}}</div>
      <h1><span class="hl">{{agenty-kibershchytu.title}}</span></h1>
      <p>{{agenty-kibershchytu.seoLead}}</p>
    </div>
  </div>
</main>
