<main id="main">
  <section class="wrap hero">
    <div>
      <p class="notebook-head"><span id="today">{{ns.hero.today}}</span><span>{{ns.hero.note}}</span></p>
      <h1><span class="hl">{{ns.hero.title}}</span></h1>
      <p class="lead">{{ns.hero.lead}}</p>
    </div>
    <div class="hero-art" aria-hidden="true">
      <svg viewBox="0 0 380 300">
        <g transform="rotate(-6 190 150)">
          <rect x="40" y="40" width="280" height="200" rx="16" fill="#14213A"/>
          <rect x="56" y="56" width="248" height="160" rx="6" fill="#F5F8FF"/>
          <rect x="56" y="56" width="248" height="24" rx="6" fill="#2D55E0"/>
          <circle cx="72" cy="68" r="4" fill="#FFE45C"/><circle cx="86" cy="68" r="4" fill="#FFFFFF" opacity=".6"/><circle cx="100" cy="68" r="4" fill="#FFFFFF" opacity=".6"/>
          <g font-family="Nunito, sans-serif" font-weight="800" font-size="15">
            <text x="74" y="110"><tspan fill="#A855F7">{{ns.art.when}}</tspan><tspan dx="6" fill="#14213A">{{ns.art.run}}</tspan></text>
            <text x="90" y="138"><tspan fill="#3B82F6">{{ns.art.forward}}</tspan><tspan dx="6" fill="#17905A">3</tspan></text>
            <text x="90" y="166"><tspan fill="#A855F7">{{ns.art.turn}}</tspan><tspan dx="6" fill="#14213A">{{ns.art.left}}</tspan></text>
            <text x="90" y="194"><tspan fill="#3B82F6">{{ns.art.forward}}</tspan><tspan dx="6" fill="#17905A">2</tspan></text>
          </g>
          <rect x="140" y="240" width="80" height="12" rx="4" fill="#14213A"/>
        </g>
        <g transform="rotate(10 300 90)">
          <path d="M300 30l44 16v32c0 26-18 44-44 52-26-8-44-26-44-52V46z" fill="#FFE45C" stroke="#14213A" stroke-width="4" stroke-linejoin="round"/>
          <path d="M282 80l13 13 24-26" stroke="#14213A" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
        </g>
        <g transform="rotate(-14 70 250)">
          <rect x="14" y="236" width="130" height="18" rx="4" fill="#E3655B"/>
          <rect x="144" y="236" width="22" height="18" fill="#F2C9A0"/>
          <path d="M166 236l18 9-18 9z" fill="#14213A"/>
          <rect x="6" y="236" width="12" height="18" rx="3" fill="#FFB3C1"/>
        </g>
      </svg>
    </div>
  </section>

  <section class="wrap filters" id="filters" aria-labelledby="fh" hidden>
    <h2 id="fh" class="vh">{{ns.filters.heading}}</h2>
    <div class="f-row">
      <div class="f"><label for="f-grade">{{ns.filter.grade}}</label><select id="f-grade"><option value="">{{ns.filter.all}}</option>{{{filterGrade}}}</select></div>
      <div class="f"><label for="f-type">{{ns.filter.type}}</label><select id="f-type"><option value="">{{ns.filter.all}}</option>{{{filterType}}}</select></div>
      <div class="f"><label for="f-topic">{{ns.filter.topic}}</label><select id="f-topic"><option value="">{{ns.filter.all}}</option>{{{filterTopic}}}</select></div>
      <div class="f"><label for="f-level">{{ns.filter.level}}</label><select id="f-level"><option value="">{{ns.filter.anyLevel}}</option>{{{filterLevel}}}</select></div>
      <button type="button" class="f-reset" id="f-reset">{{ns.filter.reset}}</button>
    </div>
    <p class="f-count" id="f-count" role="status" aria-live="polite"></p>
    <div class="f-empty" id="f-empty" hidden>
      <p>{{ns.empty}}</p>
      <button type="button" class="f-reset" id="f-reset2">{{ns.filter.reset}}</button>
    </div>
  </section>

{{{sections}}}
</main>
