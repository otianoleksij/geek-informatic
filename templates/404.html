<!doctype html>
<html lang="uk" data-base="{{basePath}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="{{{csp}}}">
<title data-en="{{en:notfound.title}}">{{notfound.title}}</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#EEF3FA">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%232D55E0'/%3E%3Cpath d='M12 10l-5 6 5 6M20 10l5 6-5 6' stroke='%23fff' stroke-width='2.6' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="preload" href="{{basePath}}assets/fonts/nunito-cyrillic.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="{{basePath}}assets/fonts/fonts.css">
<link rel="stylesheet" href="{{basePath}}assets/css/tokens.css">
<link rel="stylesheet" href="{{basePath}}assets/css/base.css">
<link rel="stylesheet" href="{{basePath}}pages/notfound/notfound.css">
</head>
<body>
<a class="skip" href="#main" data-en="{{en:common.skip}}">{{common.skip}}</a>
<div class="wrap">
  <a class="logo" href="{{basePath}}" aria-label="{{common.logoLabel}}" data-en-label="{{en:common.logoLabel}}" data-en-href="{{basePath}}en/"><span class="mk"><svg width="22" height="22" viewBox="0 0 32 32" aria-hidden="true"><path d="M12 10l-5 6 5 6M20 10l5 6-5 6" stroke="#fff" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></span>{{common.siteName}}</a>
  <main id="main">
    <h1><span data-en="{{en:notfound.h1}}">{{notfound.h1}}</span></h1>
    <p data-en="{{en:notfound.p}}">{{notfound.p}}</p>
    <a class="btn" href="{{basePath}}" data-en-href="{{basePath}}en/" data-en="{{en:notfound.home}}">{{notfound.home}}</a>
    <h2 data-en="{{en:notfound.list}}">{{notfound.list}}</h2>
    <ul>
{{{links}}}
    </ul>
  </main>
  <p class="foot"><a href="{{basePath}}teachers/" data-en-href="{{basePath}}en/teachers/" data-en="{{en:common.teachers}}">{{common.teachers}}</a> · <a href="{{basePath}}privacy/" data-en-href="{{basePath}}en/privacy/" data-en="{{en:common.privacy}}">{{common.privacy}}</a></p>
</div>
<script src="{{basePath}}pages/notfound/notfound.js" defer></script>
</body>
</html>
