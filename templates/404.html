<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title data-en="{{en:notfound.title}}">{{notfound.title}}</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#EEF3FA">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%232D55E0'/%3E%3Cpath d='M12 10l-5 6 5 6M20 10l5 6-5 6' stroke='%23fff' stroke-width='2.6' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="preload" href="{{basePath}}assets/fonts/nunito-cyrillic.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="{{basePath}}assets/fonts/fonts.css">
<link rel="stylesheet" href="{{basePath}}assets/css/tokens.css">
<link rel="stylesheet" href="{{basePath}}assets/css/base.css">
<style>
.wrap{padding:24px max(16px,env(safe-area-inset-right,0px)) 40px max(24px,env(safe-area-inset-left,0px))}
.logo{display:inline-flex;align-items:center;min-height:44px;color:inherit}
h1{font:800 clamp(30px,6vw,52px)/1.12 var(--f-display);letter-spacing:-.02em;margin:48px 0 16px;text-wrap:balance}
h1 span{background:linear-gradient(transparent 60%,var(--hl) 60%,var(--hl) 92%,transparent 92%);padding:0 .06em}
p{margin:0 0 20px;max-width:560px;color:var(--muted)}
.btn{display:inline-block;font:800 16px/1 var(--f-body);background:#2D55E0;color:#fff;padding:13px 20px;border-radius:12px;box-shadow:0 3px 0 #1B3AA8;text-decoration:none}
h2{font:800 22px/1.2 var(--f-display);margin:40px 0 14px;letter-spacing:normal;text-wrap:wrap}
ul{list-style:none;margin:0;padding:0;display:grid;gap:8px}
li a{display:inline-block;min-height:44px;padding:10px 0;font-weight:800;color:var(--accent)}
.foot{margin-top:40px}
.foot a{display:inline-block;min-height:44px;padding:10px 2px;font-weight:800;color:var(--accent)}
</style>
</head>
<body>
<div class="wrap">
  <a class="logo" href="{{basePath}}" aria-label="{{common.logoLabel}}" data-en-label="{{en:common.logoLabel}}" data-en-href="{{basePath}}en/"><span class="mk"><svg width="22" height="22" viewBox="0 0 32 32" aria-hidden="true"><path d="M12 10l-5 6 5 6M20 10l5 6-5 6" stroke="#fff" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></span>{{common.siteName}}</a>
  <main>
    <h1><span data-en="{{en:notfound.h1}}">{{notfound.h1}}</span></h1>
    <p data-en="{{en:notfound.p}}">{{notfound.p}}</p>
    <a class="btn" href="{{basePath}}" data-en-href="{{basePath}}en/" data-en="{{en:notfound.home}}">{{notfound.home}}</a>
    <h2 data-en="{{en:notfound.list}}">{{notfound.list}}</h2>
    <ul>
{{{links}}}
    </ul>
  </main>
  <p class="foot"><a href="{{basePath}}teachers/" data-en-href="{{basePath}}en/teachers/" data-en="{{en:common.teachers}}">{{common.teachers}}</a> · <a href="{{basePath}}privacy/" data-en-href="{{basePath}}en/privacy/" data-en="{{en:common.privacy}}">{{common.privacy}}</a></p>
</div>
<script>
/* GitHub Pages віддає цей файл для будь-якого неіснуючого адресу. Для адрес під en/ перемикаємо тексти й посилання на англійську. */
(function () {
  if (location.pathname.indexOf("{{basePath}}en/") !== 0) return;
  document.documentElement.lang = "en";
  [].forEach.call(document.querySelectorAll("[data-en]"), function (e) { e.textContent = e.getAttribute("data-en"); });
  [].forEach.call(document.querySelectorAll("[data-en-href]"), function (e) { e.setAttribute("href", e.getAttribute("data-en-href")); });
  [].forEach.call(document.querySelectorAll("[data-en-label]"), function (e) { e.setAttribute("aria-label", e.getAttribute("data-en-label")); });
})();
</script>
</body>
</html>
