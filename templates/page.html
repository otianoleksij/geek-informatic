<!doctype html>
<html lang="{{lang}}" data-root="{{root}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="{{{csp}}}">
<title>{{title}}</title>
<meta name="description" content="{{description}}">
<link rel="canonical" href="{{canonical}}">
{{{hreflang}}}
<meta property="og:type" content="website">
<meta property="og:site_name" content="{{common.siteName}}">
<meta property="og:locale" content="{{ogLocale}}">
<meta property="og:title" content="{{title}}">
<meta property="og:description" content="{{ogDescription}}">
<meta property="og:url" content="{{canonical}}">
<meta property="og:image" content="{{ogImage}}">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="{{ogAlt}}">
<meta name="twitter:card" content="summary_large_image">
<script type="application/ld+json">{{{jsonld}}}</script>
<meta name="theme-color" content="{{themeColor}}">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%232D55E0'/%3E%3Cpath d='M12 10l-5 6 5 6M20 10l5 6-5 6' stroke='%23FFE45C' stroke-width='3' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="preload" href="{{root}}assets/fonts/{{fontFile}}" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="{{root}}assets/fonts/fonts.css">
<link rel="stylesheet" href="{{root}}assets/css/tokens.css">
<link rel="stylesheet" href="{{root}}assets/css/base.css">
{{{styles}}}</head>
<body>
<a class="skip" href="#main">{{common.skip}}</a>

<header class="top">
  <div class="wrap">
    <a class="logo" href="{{homeHref}}" aria-label="{{common.logoLabel}}">
      <span class="mk"><svg viewBox="0 0 24 24" fill="none" stroke="#FFE45C" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 7l-5 5 5 5M15 7l5 5-5 5"/></svg></span>
      <span>{{common.siteName}}<small>{{common.tagline}}</small></span>
    </a>
    <nav aria-label="{{common.navLabel}}">{{{nav}}}<a class="lang-switch" href="{{altHref}}" hreflang="{{altLang}}" lang="{{altLang}}" title="{{common.langSwitch}}">{{altName}}</a></nav>
  </div>
</header>

{{{body}}}

<footer>
  <div class="wrap">
    <span>{{common.siteName}} · {{common.footer}} · <a href="{{root}}{{prefix}}teachers/">{{common.teachers}}</a> · <a href="{{root}}{{prefix}}privacy/">{{common.privacy}}</a></span>
    <span id="yr">2026</span>
  </div>
</footer>

{{#if i18nData}}<script type="application/json" id="i18n-data">{{{i18nData}}}</script>
{{/if}}{{{scripts}}}
</body>
</html>
