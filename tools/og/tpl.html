<!doctype html><meta charset="utf-8"><style>
@font-face{font-family:"Unbounded";font-weight:600 800;src:url({{F}}unbounded-cyrillic.woff2);unicode-range:U+0301,U+0400-045F,U+0490-0491,U+04B0-04B1,U+2116}
@font-face{font-family:"Unbounded";font-weight:600 800;src:url({{F}}unbounded-latin.woff2);unicode-range:U+0000-00FF,U+0131,U+2000-206F,U+20AC}
@font-face{font-family:"Nunito";font-weight:400 800;src:url({{F}}nunito-cyrillic.woff2);unicode-range:U+0301,U+0400-045F,U+0490-0491,U+04B0-04B1,U+2116}
@font-face{font-family:"Nunito";font-weight:400 800;src:url({{F}}nunito-latin.woff2);unicode-range:U+0000-00FF,U+0131,U+2000-206F,U+20AC}
*{box-sizing:border-box}html,body{margin:0}
body{width:1200px;height:630px;overflow:hidden;position:relative;background-color:#EEF3FA;color:#14213A;
background-image:linear-gradient(rgba(45,85,224,.10) 1px,transparent 1px),linear-gradient(90deg,rgba(45,85,224,.10) 1px,transparent 1px);background-size:24px 24px;font-family:"Nunito",sans-serif}
.m{position:absolute;top:0;bottom:0;left:56px;border-left:3px solid rgba(227,101,91,.55)}
.logo{position:absolute;left:96px;top:56px;display:flex;align-items:center;gap:16px;font:800 34px "Unbounded";letter-spacing:-.01em}
.mk{width:56px;height:56px;border-radius:16px;background:#2D55E0;box-shadow:0 4px 0 #1B3AA8;display:grid;place-items:center}
.t{position:absolute;left:96px;top:190px;width:640px;font:800 72px/1.12 "Unbounded";letter-spacing:-.02em}
.t span{background:linear-gradient(transparent 60%,#FFE45C 60%,#FFE45C 92%,transparent 92%);padding:0 .06em}
.s{position:absolute;left:96px;bottom:64px;font:800 36px "Nunito";color:#2D55E0}
.c{position:absolute;right:64px;top:84px;width:380px;height:462px;border-radius:32px;background:linear-gradient(160deg,{{C1}},{{C2}});box-shadow:0 10px 0 rgba(20,33,58,.25);transform:rotate(2.5deg)}
.c svg{position:absolute;left:30px;top:96px;width:320px;height:320px}
.g{position:absolute;left:28px;top:28px;background:#FFE45C;color:#14213A;font:800 34px "Nunito";padding:6px 22px;border-radius:999px}
</style><body><div class="m"></div>
<div class="logo"><div class="mk"><svg width="32" height="32" viewBox="0 0 32 32">{{LOGO}}</svg></div>Geek Informatic</div>
<div class="t" style="{{TS}}"><span>{{T}}</span></div><div class="s">{{S}}</div>
<div class="c"><div class="g">{{G}}</div><svg viewBox="0 0 120 120">{{ICON}}</svg></div></body>
